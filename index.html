<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Canvas EditContext demo</title>
<style>
#resizer {
  display: inline-block;
  resize: both;
  overflow: hidden;
  position: relative;
}
#canvas {
  width: 100%;
  height: 100%;
}
#alt {
  position: absolute;
  top: 5px;
  left: 5px;
  font-family: sans-serif;
  font-size: 18px;
  pointer-events: none;
  white-space: pre;
}
p {
  margin: 0;
  line-height: 1.25;
}
</style>
</head>
<body>
<h1>Canvas EditContext demo</h1>
<p><em>This is not intended to be a feature-complete editor - it is missing important functionality,
doesn't handle non-BMP Unicode characters, combining diacritics, RTL/vertical text, etc., and has other strange behaviour.</em></p>
<details>
<summary>Debugging</summary>
<label><input id="show-alt" type="checkbox"> Show alt content overlay</label>
</details>
<div id="resizer" style="width: 720px; height: 360px;"><canvas id="canvas" width="720" height="360"></canvas><div id="alt"></div></div>
<script src="editor.js"></script>
</body>
</html>
