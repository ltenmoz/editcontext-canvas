<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Canvas EditContext demo</title>
<style>
#resizer {
  display: inline-block;
  resize: both;
  overflow: hidden;
}
#canvas {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<h1>Canvas EditContext demo</h1>
<p><em>This is not intended to be a feature-complete editor - it is missing important functionality,
doesn't handle non-BMP Unicode characters, combining diacritics, RTL/vertical text, etc., and has other strange behaviour.</em></p>
<div id="resizer" style="width: 720px; height: 360px;"><canvas id="canvas" width="720" height="360"></canvas></div>
<p>Fallback content for assistive technology:</p>
<div id="alt" style="white-space: pre;"></div>
<script src="editor.js"></script>
</body>
</html>
