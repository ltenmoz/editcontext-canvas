<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Canvas EditContext demo</title>
<style>
#resizer {
  display: inline-block;
  resize: both;
  overflow: hidden;
  position: relative;
}
/* Give #resizer the focus outline so it isn't cut off. */
#resizer:has(:focus) {
  outline: 2px solid darkorange;
}
#canvas {
  width: 100%;
  height: 100%;
  outline: 0;
}
#alt {
  position: absolute;
  top: 5px;
  left: 5px;
  font-family: sans-serif;
  font-size: 18px;
  pointer-events: none;
  white-space: pre;
}
p {
  margin: 0;
  line-height: 1.25;
}
</style>
</head>
<body>
<h1>Canvas EditContext demo</h1>
<p><em>This is not intended to be a feature-complete editor - it is missing important functionality,
doesn't handle non-BMP Unicode characters, combining diacritics, RTL/vertical text, etc., and has other strange behaviour.</em></p>
<details>
<summary>Debugging</summary>
<label style="color:blue;"><input id="show-selection-bounds" type="checkbox"> Show selection bounds</label>
<label style="color:red;"><input id="show-character-bounds" type="checkbox"> Show character bounds</label>
</details>
<div id="resizer" style="width: 720px; height: 360px;"><canvas id="canvas" width="720" height="360" aria-label="Editor" role="textbox" aria-multiline="true"><div id="alt"></div></canvas></div>
<script src="editor.js"></script>
</body>
</html>
